[workspace]
members = ["crates/clip-refiner", "crates/clip-refiner-core"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.96"
authors = ["Yuto Hirata"]

# メンバは `workspace = true` で参照する。optional / 追加 features は各 Cargo.toml で指定する
[workspace.dependencies]
clip-refiner-core = { path = "crates/clip-refiner-core" }

anyhow = "1.0.103"
arboard = "3.6.1"
base64 = "0.23.1"
blake3 = "1.8.6"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
clipboard-win = { version = "5.4.1", features = ["std"] }
csv = "1.4.0"
getrandom = "0.4.3"
global-hotkey = "0.8.0"
image = { version = "0.25.10", default-features = false, features = ["bmp", "jpeg", "png"] }
indexmap = { version = "2.14.0", features = ["serde"] }
percent-encoding = "2.3.2"
png = "0.18.1"
proptest = "1.11.0"
pulldown-cmark = "0.13.4"
regex = "1.13.0"
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_norway = "0.9.42"
sha2 = "0.11.0"
single-instance = "0.3.3"
strum = { version = "0.28.0", features = ["derive"] }
tao = "0.36.0"
thiserror = "2.0.20"
toml = "1.1.4"
toml_edit = "0.25.13"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tray-icon = "0.24.1"
ureq = { version = "3.4.0", features = ["json"] }
windows = "0.62.2"
windows-future = { version = "0.3.2", features = ["std"] }
winreg = "0.56.0"
winres = "0.1.12"
wry = "0.56.1"
zeroize = "1.9.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
debug = false
strip = true
lto = "fat"
incremental = false
codegen-units = 1

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
must_use_candidate = { level = "allow", priority = 1 }
