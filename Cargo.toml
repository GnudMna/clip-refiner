[workspace]
members = ["crates/clip-refiner", "crates/clip-refiner-core"]
resolver = "2"

[workspace.package]
version = "3.0.2"
edition = "2024"
rust-version = "1.96"
authors = ["Yuto Hirata"]

# メンバは `workspace = true` で参照する。optional / 追加 features は各 Cargo.toml で指定する
[workspace.dependencies]
clip-refiner-core = { path = "crates/clip-refiner-core" }

anyhow = "1.0.104"
arboard = "3.7.0"
base64 = "0.23.1"
blake3 = "1.8.7"
chacha20poly1305 = "0.11.0"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
clipboard-win = { version = "5.4.3", features = ["std"] }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
csv = "1.4.0"
getrandom = "0.4.3"
global-hotkey = "0.9.0"
htmd = "0.5.6"
image = { version = "0.25.10", default-features = false, features = ["bmp", "jpeg", "png"] }
indexmap = { version = "2.14.2", features = ["serde"] }
minisign = "0.10.0"
minisign-verify = "0.3.0"
percent-encoding = "2.3.2"
png = "0.18.1"
proptest = "1.12.0"
pulldown-cmark = "0.13.6"
regex = "1.13.1"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_norway = "0.9.42"
sha2 = "0.11.1"
strum = { version = "0.28.0", features = ["derive"] }
tao = "0.37.2"
thiserror = "2.0.21"
toml = "1.1.8"
toml_edit = "0.25.17"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tray-icon = "0.26.1"
ureq = { version = "3.5.0", default-features = false, features = ["json", "native-tls"] }
windows = "0.62.2"
winreg = "0.56.0"
winresource = "0.1.34"
wry = "0.57.1"
zeroize = "1.9.1"
zip = { version = "9.2.2", default-features = false, features = ["deflate"] }

# 開発ビルド: PDB を小さくしてリンクを速くする。行番号付きのバックトレースは残る
[profile.dev]
debug = "line-tables-only"

# 依存クレートだけ最適化する (自前コードのデバッグ性は保つ)。regex / image / proptest などが速くなる
[profile.dev.package."*"]
opt-level = 1

[profile.release]
opt-level = 3
debug = false
strip = true
lto = "fat"
incremental = false
codegen-units = 1

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
must_use_candidate = { level = "allow", priority = 1 }
allow_attributes_without_reason = { level = "warn", priority = 1 }
undocumented_unsafe_blocks = { level = "warn", priority = 1 }
unwrap_used = { level = "warn", priority = 1 }
expect_used = { level = "warn", priority = 1 }
