<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="__WEBVIEW_CSP__">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url("selector.css");
        @import url("clip_selector.css");
    </style>
</head>

<body>
    <div id="container">
        <div id="search-box">
            <div class="selector-heading">登録クリップセレクター</div>
            <input type="text" id="input" placeholder="ラベル・プレビューで検索..." autocomplete="off" spellcheck="false">
        </div>
        <div id="results"></div>
        <div id="footer">
            <span class="hint"><kbd>↑↓</kbd>移動</span>
            <span class="hint"><kbd>Enter</kbd>コピー</span>
            <span class="hint"><kbd>Del</kbd>削除</span>
            <span class="hint"><kbd>Ctrl+Enter</kbd>登録</span>
            <span class="hint"><kbd>Ctrl+Shift+↑↓</kbd>順序</span>
            <span class="hint"><kbd>Ctrl+T</kbd>テンプレート</span>
            <span class="hint"><kbd>Ctrl+R</kbd>連番リセット</span>
            <span class="hint"><kbd>Esc</kbd>閉じる</span>
        </div>
    </div>
    <div id="image-hover-preview" aria-hidden="true">
        <img alt="">
        <span class="image-hover-preview-caption"></span>
    </div>

    <div id="text-hover-preview" role="tooltip" aria-hidden="true"></div>

    <script src="clip_selector.js"></script>
</body>

</html>
