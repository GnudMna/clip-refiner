[package]
name = "clip-refiner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "クリップボードのテキストを加工するツール"
readme = "../../README.md"
publish = false
build = "build.rs"

[package.metadata.wix]
upgrade-guid = "A3C8E2F1-9B4D-4E7A-8C1F-2D5E6A9B0C3D"
path-guid = "B7D1F4A2-6E8C-4B9F-A3D2-1C4E7F8A9B0D"
product-icon = "../../assets/icon.ico"
eula = true
culture = "ja-JP"
# perUser 専用のため ICE91 (ALLUSERS 非対応ディレクトリ) を抑制
linker-args = ["-sice:ICE91"]

[lib]
name = "clip_refiner"
path = "src/lib.rs"

[[bin]]
name = "ClipRefiner"
path = "src/main.rs"
required-features = ["app"]

[features]
default = ["app"]
app = [
    "dep:anyhow",
    "dep:arboard",
    "dep:base64",
    "dep:chrono",
    "dep:clap",
    "dep:global-hotkey",
    "dep:image",
    "dep:png",
    "dep:single-instance",
    "dep:tao",
    "dep:tracing-appender",
    "dep:tracing-subscriber",
    "dep:tray-icon",
    "dep:wry",
    "dep:serde_json",
    "dep:strum",
    "dep:clipboard-win",
    "dep:windows",
    "dep:windows-future",
    "dep:winreg",
]
test-helpers = ["clip-refiner-core/test-helpers"]

[[test]]
name = "monitor_flow"
path = "tests/monitor_flow.rs"
required-features = ["app"]

[[test]]
name = "worker_flow"
path = "tests/worker_flow.rs"
required-features = ["app"]

[[test]]
name = "history_flow"
path = "tests/history_flow.rs"
required-features = ["app"]

[[test]]
name = "regex_flow"
path = "tests/regex_flow.rs"
required-features = ["app"]

[[test]]
name = "ocr_flow"
path = "tests/ocr_flow.rs"
required-features = ["app"]

[[test]]
name = "record_flow"
path = "tests/record_flow.rs"
required-features = ["app"]

[[test]]
name = "clips_flow"
path = "tests/clips_flow.rs"
required-features = ["app"]

[[test]]
name = "settings_flow"
path = "tests/settings_flow.rs"
required-features = ["app"]

[[test]]
name = "library_api"
path = "tests/library_api.rs"

[[test]]
name = "worker_recovery_flow"
path = "tests/worker_recovery_flow.rs"
required-features = ["app"]

[[test]]
name = "oneshot_flow"
path = "tests/oneshot_flow.rs"

[[test]]
name = "settings_ui_logic"
path = "tests/settings_ui_logic.rs"

[[test]]
name = "regex_preview_logic"
path = "tests/regex_preview_logic.rs"

[[test]]
name = "notification_flow"
path = "tests/notification_flow.rs"
required-features = ["app"]

[[test]]
name = "settings_shared_logic"
path = "tests/settings_shared_logic.rs"
required-features = ["app"]

[[test]]
name = "platform_flow"
path = "tests/platform_flow.rs"
required-features = ["app"]

[dependencies]
clip-refiner-core = { path = "../clip-refiner-core", version = "0.12.3" }
anyhow = { version = "1.0.103", optional = true }
arboard = { version = "3.6.1", optional = true }
base64 = { version = "0.22.1", optional = true }
chrono = { version = "0.4.45", optional = true, features = ["serde"] }
clap = { version = "4.6.1", optional = true, features = ["derive"] }
global-hotkey = { version = "0.8.0", optional = true }
image = { version = "0.25.9", optional = true, default-features = false, features = ["bmp", "jpeg", "png"] }
png = { version = "0.18.1", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.150", optional = true }
single-instance = { version = "0.3.3", optional = true }
strum = { version = "0.28.0", optional = true, features = ["derive"] }
tao = { version = "0.35.3", optional = true }
tracing = "0.1.44"
tracing-appender = { version = "0.2.5", optional = true }
tracing-subscriber = { version = "0.3.23", optional = true, features = ["env-filter"] }
tray-icon = { version = "0.24.1", optional = true }
wry = { version = "0.55.1", optional = true }
clipboard-win = { version = "5.0", optional = true, features = ["std"] }
windows = { version = "0.62.2", optional = true, features = [
    "Data_Xml_Dom",
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-future = { version = "0.3.2", optional = true, features = ["std"] }
winreg = { version = "0.56.0", optional = true }

[dev-dependencies]
toml = "1.1.2"

[build-dependencies]
winres = "0.1"

[lints]
workspace = true
