[package]
name = "clip-refiner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "クリップボードのテキストを加工するツール"
readme = "../../README.md"
publish = false
build = "build.rs"

[package.metadata.wix]
upgrade-guid = "A3C8E2F1-9B4D-4E7A-8C1F-2D5E6A9B0C3D"
path-guid = "B7D1F4A2-6E8C-4B9F-A3D2-1C4E7F8A9B0D"
product-icon = "../../assets/icon.ico"
culture = "ja-JP"
# perUser 専用のため ICE91 (ALLUSERS 非対応ディレクトリ) を抑制
linker-args = ["-sice:ICE91"]

[lib]
name = "clip_refiner"
path = "src/lib.rs"

[[bin]]
name = "ClipRefiner"
path = "src/main.rs"
required-features = ["app"]

[features]
default = ["app"]
app = [
    "dep:clip-refiner-updater",
    "dep:anyhow",
    "dep:base64",
    "dep:clap",
    "dep:getrandom",
    "dep:jiff",
    "dep:global-hotkey",
    "dep:image",
    "dep:png",
    "dep:tao",
    "dep:thiserror",
    "dep:tracing-appender",
    "dep:tracing-subscriber",
    "dep:tray-icon",
    "dep:webview2-com",
    "dep:wry",
    "dep:serde_json",
    "dep:sha2",
    "dep:strum",
    "dep:clipboard-win",
    "dep:windows",
    "dep:winreg",
]
test-helpers = ["clip-refiner-core/test-helpers"]

[dependencies]
clip-refiner-core = { workspace = true, features = ["clipboard", "config"] }
clip-refiner-updater = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
jiff = { workspace = true, optional = true }
global-hotkey = { workspace = true, optional = true }
image = { workspace = true, optional = true }
png = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
strum = { workspace = true, optional = true }
tao = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tracing.workspace = true
tracing-appender = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
tray-icon = { workspace = true, optional = true }
webview2-com = { workspace = true, optional = true }
wry = { workspace = true, optional = true }
clipboard-win = { workspace = true, optional = true, features = ["monitor"] }
windows = { workspace = true, optional = true, features = [
    "Data_Xml_Dom",
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = { workspace = true, optional = true }

[dev-dependencies]
sha2.workspace = true
toml.workspace = true

[build-dependencies]
winresource.workspace = true

[lints]
workspace = true
