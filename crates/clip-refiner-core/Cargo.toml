[package]
name = "clip-refiner-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "ClipRefiner の加工ロジックと設定型 (GUI 非依存)"
readme = "../../README.md"
license-file = "../../LICENSE"
publish = false

[lib]
name = "clip_refiner_core"
path = "src/lib.rs"

[features]
test-helpers = []

[dependencies]
anyhow = "1.0.103"
arboard = "3.6.1"
base64 = "0.22.1"
blake3 = "1.8.5"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", features = ["serde"] }
csv = "1.4.0"
getrandom = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["bmp", "jpeg", "png"] }
indexmap = { version = "2.14.0", features = ["serde"] }
percent-encoding = "2.3.2"
pulldown-cmark = "0.13.4"
regex = "1.13.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_norway = "0.9.42"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.18"
toml = "1.1.2"
toml_edit = "0.25.12"
tracing = "0.1.44"
zeroize = "1.9.0"
clipboard-win = { version = "5.4.1", features = ["std"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
] }

[dev-dependencies]
proptest = "1.11.0"

[lints]
workspace = true
