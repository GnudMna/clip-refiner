[package]
name = "clip-refiner-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "ClipRefiner の加工ロジックと設定型 (GUI 非依存)"
readme = "README.md"
license-file = "../../LICENSE"
publish = false

[lib]
name = "clip_refiner_core"
path = "src/lib.rs"

[features]
default = ["clipboard", "config"]
# OS クリップボード本文 I/O (`OwnedClipboard` / arboard / CF_DIB)
clipboard = ["dep:arboard", "dep:clipboard-win"]
# 設定永続化・DPAPI・登録クリップ暗号 (Windows)
config = [
    "dep:base64",
    "dep:blake3",
    "dep:chacha20poly1305",
    "dep:getrandom",
    "dep:image",
    "dep:toml",
    "dep:toml_edit",
    "dep:windows",
    "dep:zeroize",
]
test-helpers = []

[dependencies]
arboard = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
blake3 = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }
chrono.workspace = true
csv.workspace = true
getrandom = { workspace = true, optional = true }
image = { workspace = true, optional = true }
indexmap.workspace = true
percent-encoding.workspace = true
pulldown-cmark.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
strum.workspace = true
thiserror.workspace = true
toml = { workspace = true, optional = true }
toml_edit = { workspace = true, optional = true }
tracing.workspace = true
zeroize = { workspace = true, optional = true }
clipboard-win = { workspace = true, optional = true }
windows = { workspace = true, optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
