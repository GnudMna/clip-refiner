[package]
name = "clip-refiner-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "ClipRefiner の加工ロジックと設定型 (GUI 非依存)"
readme = "README.md"
license.workspace = true
publish = false

[lib]
name = "clip_refiner_core"
path = "src/lib.rs"

[[bench]]
name = "transforms"
harness = false

[features]
default = ["clipboard", "config"]
# OS クリップボード本文 I/O (`OwnedClipboard` / arboard / CF_DIB / 仮想ファイル)
clipboard = ["dep:arboard", "dep:clipboard-win", "dep:windows"]
# 設定永続化・DPAPI・登録クリップ暗号 (Windows)
config = [
    "dep:blake3",
    "dep:chacha20poly1305",
    "dep:getrandom",
    "dep:toml",
    "dep:toml_edit",
    "dep:windows",
    "dep:zeroize",
]
test-helpers = []

[dependencies]
arboard = { workspace = true, optional = true }
base64.workspace = true
blake3 = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }
csv.workspace = true
getrandom = { workspace = true, optional = true }
jiff.workspace = true
htmd.workspace = true
image.workspace = true
indexmap.workspace = true
percent-encoding.workspace = true
pulldown-cmark.workspace = true
regex.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["arbitrary_precision"] }
serde_norway.workspace = true
strum.workspace = true
thiserror.workspace = true
toml = { workspace = true, optional = true }
toml_edit = { workspace = true, optional = true }
tracing.workspace = true
zeroize = { workspace = true, optional = true }
clipboard-win = { workspace = true, optional = true }
windows = { workspace = true, optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true

[lints]
workspace = true
