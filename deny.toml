# ClipRefiner 依存関係のサプライチェーン監査 (cargo-deny)
#
# 実行: cargo deny check
# 品質チェック: scripts/*/check.* からも呼び出す
#
# ライセンス方針: 独自製品への組み込みが可能なパーミッシブライセンスのみ許可する
# (コピーレフト GPL / LGPL / MPL 等は deny 対象。許可リストに含めない)
#
# 例外: 配布物の利用者向けドキュメント (docs\) は mdBook のテーマ (MPL-2.0) を改変せずに含む。
# Rust の依存としてリンクしない別ファイルで、ファイル単位の義務 (ライセンス全文とソースの入手先の表示) を
# scripts/templates/user-docs-notices.txt で満たすため、cargo-deny の対象外として扱う
# (詳細は docs/dev/setup.md の「利用者向けドキュメントの同梱」)

[graph]
all-features = true
# テスト専用の dev-dependencies (minisign 経由の sha2 0.10 など) は配布物に入らないため対象外にする
exclude-dev = true
targets = [
    { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
unused-allowed-license = "allow"
confidence-threshold = 0.8
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    # webpki-root-certs (ureq の native-tls feature 経由) の CA バンドル用データライセンス
    "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "warn"
# ワークスペース内の path 依存 (clip-refiner-core) は publish = false のため version 指定を求めない
allow-wildcard-paths = true
# 上流クレートの依存版が揃うまで解消できない多重バージョン。新しい重複は warn で検出し続ける
# 上流が揃ったら unmatched-skip の警告が出るので、該当の skip を削除する
skip = [
    { crate = "miniz_oxide@0.8.9", reason = "png 0.18 が直接依存 (flate2 経由の zip・png は 0.9)" },
    { crate = "syn@2.0.119", reason = "proc-macro のビルド時のみ。strum_macros・tracing-attributes などが syn 2、serde_derive・thiserror-impl などが syn 3" },
    { crate = "windows-sys@0.59.0", reason = "global-hotkey 0.10 が依存" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
