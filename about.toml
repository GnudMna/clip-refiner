# cargo-about 設定 (THIRD_PARTY_NOTICES 生成)
#
# 生成: scripts/common/generate-third-party-notices.ps1
# deny.toml の許可ライセンスに合わせる (Windows のみ)
# ワークスペース内の非公開クレート (publish = false) はライセンス検査対象外
# (deny.toml の [licenses.private] と同方針)

accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    # webpki-roots (ureq / rustls 経由) の CA バンドル用データライセンス
    "CDLA-Permissive-2.0",
]

targets = [
    "x86_64-pc-windows-msvc",
]

private = { ignore = true }

ignore-build-dependencies = true
ignore-dev-dependencies = true
